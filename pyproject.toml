[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "okaff"
version = "0.1.0"
description = "online kernel-based changepoint detector with adaptive forgetting factors"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5"]

[project.scripts]
okaff-detect-single = "okaff.single:main"
okaff-detect-multiple = "okaff.multiple:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["okaff*"]
