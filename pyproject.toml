[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "okaffpy"
version = "0.1.0"
description = "Online kernel adaptive forgetting factor changepoint detection"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5"]

[project.scripts]
okaff-detect-single = "okaffpy.single:main"
okaff-detect-multiple = "okaffpy.multiple:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["okaffpy*"]
